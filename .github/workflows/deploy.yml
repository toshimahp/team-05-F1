name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Install packages
          working-directory: backend
          run: pip install -r requirements.txt requests pytest

        - name: Start the API
          working-directory: backend
          env:
            DB_URL: sqlite:///test.db
          run: |
            nohup python -m uvicorn main:app --port 8001 > server.log 2>&1 &
            sleep 5

        - name: Run tests
          working-directory: backend
          run: python -m pytest -v
  build-push-deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      # Docker Hub image name in the form <dockerhub-username>/<repo-name>, e.g. malnadhudga/todo-list.
      # The username comes from the DOCKERHUB_USERNAME secret; change "todo-list" to your own repo name.
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/team-05-f1
      VERSION: v${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            sudo systemctl enable --now docker
            sudo usermod -aG docker $USER
            sudo docker pull ${{ env.IMAGE }}:${{ env.VERSION }}
            sudo docker rm -f team-05-f1 todo-list || true
            mkdir -p $HOME/f1-data
            sudo docker run -d --name team-05-f1 --restart unless-stopped -p 8001:8001 -v $HOME/f1-data:/app/data -e DB_URL=sqlite:////app/data/F1.db ${{ env.IMAGE }}:${{ env.VERSION }} uvicorn main:app --host 0.0.0.0 --port 8001
            sudo docker image prune -af
            sudo docker ps --filter name=team-05-f1
